name: Release Contour

on:
  push:
    tags: [v1.0]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and publish the source archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p .contour/release
          git archive --format=zip --prefix=contour-1.0/ \
            --output=.contour/release/contour-1.0.zip HEAD
          gh release create "$GITHUB_REF_NAME" .contour/release/contour-1.0.zip \
            --verify-tag --title "Contour 1.0" --generate-notes
